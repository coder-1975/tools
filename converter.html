<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <style>
      * {
        padding: 0;
        margin: 0;
        outline: none;
      }
      :root {
        --bg-color: rgba(15, 15, 15, 0.945);
        --b-color: rgb(15, 15, 15);
      }
      body {
        background-color: rgba(78, 105, 60, 0.76);
        background-color: var(--bg-color);
      }
      .main {
        display: flex;
        font-family: sans-serif;
       
        padding: 6px;
        margin: 2px auto;
        border: 1px solid #332f2f;
        border-radius: 10px;
        width: 350px;
       
        background-color: rgba(131, 90, 90, 0.623);
        background-color: black;
        color:rgb(231, 221, 221);
        text-align: center !important;
        justify-content: center;
        text-transform: uppercase;
        font-size: xx-large;
      }
      .controls {
        font-family: sans-serif;
        padding: 5px 4px;
        border: 1px solid #fc1010;
        border-radius: 10px;
        border-top-left-radius: 0px;
        border-bottom-left-radius: 0px;
        margin-left: 2px;
        width: 350px;
        background-color: rgba(131, 90, 90, 0.623);
        h3 {
          color: #96576f;
          text-shadow: 1px 2px 3px #000;
        }
      }
      #voiceSelect {
        width: 100%;
        margin-bottom: 5px;
        background-color: #332f2f;
        color: #28a745;
      }

      #voiceSelect::-webkit-scrollbar {
        background-color: #28a745;
        display: none;
      }
      input[type="range"] {
        width: 100%;
        color: #28a745;
      }
      input[type="range"] {
        overflow: hidden;
        appearance: none;
        background: #2e2327;
        background: linear-gradient(
          to left,
          #2e2327 0%,
          #2e2327 50%,
          #554349 50%,
          #a88391 100%
        );
      }

      input[type="range"]::-webkit-slider-thumb {
        width: 8px;
        appearance: none;
        height: 12px;
        background: black;
        border-radius: 2px;
        cursor: grab;
      }

      input[type="button"] {
        visibility: hidden;
        width: 80px;
        appearance: none;
        height: 22px;
        background: black;
        border-radius: 2px;
        cursor: grab;
        color: gold;
        border: 1px solid #555151;
      }
      #talk {
        box-shadow: -2px 2px 2px 2px rgba(43, 27, 40, 0.534);
        transition: 0.5s;
      }
      #talk:hover {
        box-shadow: -1px 1px 1px 1px rgba(43, 27, 40, 0.534);
        transition: 0.3s;
      }
      #stop {
        margin-top: 10px;
        background: rgb(17, 28, 32);
        border-radius: 2px;
        cursor: grab;
        color: rgb(255, 0, 55);
      }
      #stop:hover {
        color: rgb(255, 0, 0);
        border: 1px solid rgb(255, 0, 0);
      }

      input[type="button"]:hover {
        width: 80px;
        appearance: none;
        height: 22px;
        background: rgb(51, 50, 50);
        border-radius: 2px;
        cursor: grab;
        color: rgb(255, 0, 119);
        border: 1px solid rgb(255, 0, 119);
      }

      .speechBox {
        font-family: sans-serif;
        direction: rtl;
        padding: 14px;
        border: 1px solid #ccc;
        border: 0.1px solid #ccccccc2;
        border-radius: 10px;
        border-top-right-radius: 0px;
        border-bottom-right-radius: 0px;
        width: 350px;
        background-color: #3a6e4675;
      }

      #textInput {
        resize: none;
        background-color: rgba(0, 0, 0, 0.74);
        background: linear-gradient(
          to left,
          rgb(46, 10, 10),
          rgb(5, 5, 36),
          rgb(5, 22, 5)
        );
        background-image: url(backLines.jpg);
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-origin: padding-box;
        color: #080808;
        width: 200px;
        padding: 20px 17px;
        height: 200px;
        text-align: left;
        font-size: 19px;
        font-weight: 900;
        margin-bottom: 10px;
        border: 5px solid var(--b-color);
        line-height: 30px;
      }

      #textInput::first-line {
        font-size: 1.2rem;
        font-weight: bold;
        text-decoration: underline;
        color: #fd2929;
      }

      #textInput::-webkit-scrollbar {
        background-color: #28a745;
        display: none;
      }
      .speakBtn {
        width: 100%;
        padding: 10px;
        background-color: #28a745;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 10px;
        background: linear-gradient(
          to left,
          rgb(46, 10, 10),
          rgb(5, 5, 36),
          rgb(5, 22, 5)
        );
        border: 5px double var(--b-color);
        font-size: 22px;
      }

      .speakBtn:hover {
        width: 100%;
        padding: 10px;
        background-color: #28a745;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 10px;
        background: linear-gradient(
          to left,
          rgb(5, 22, 5),
          rgb(5, 5, 36),
          rgb(46, 10, 10)
        );
        border: 5px double rgb(33, 61, 40);
      }
      span {
        display: block;
        color: white;
        min-width: 100%;
        background: linear-gradient(
          44deg,
          rgba(255, 0, 0, 0.685),
          rgba(0, 128, 0, 0.301),
          rgba(0, 0, 255, 0.24)
        );
        margin: 1px 0;
        padding: 1px 3px;
      }
      fieldset {
        background-color: #27191e;
        border: 1px solid #b94e90c0;
        color: #070707;
        margin-top: 12px;
      }
      legend {
        background-color: #55384ac0;
        min-width: 100%;
        font-weight: bold;
        text-align: center;
        box-shadow: 1px 1px 5px 2px #00000085;
      }
      span {
        text-align: left;
      }
      button {
        width: 100%;
        font-size: 20px;
        padding: 5px 2px;
        margin: 5px 2px;
        font-weight: bold;
        color:#28a745;
        background-color: #144920;
        outline: none;
        border: none;
        transition: 3s;
        letter-spacing: .02px;
        border: 1px solid #28a745;
      }
      button:hover{
        transition: 1s;
        letter-spacing: 1px;
        background-color: #28a7468c;
        color: #0e2e15;
        cursor: pointer;
        text-shadow: 2px 2px 2px #28a745;
      }
      legend{
        border:1px solid rgba(255, 255, 255, 0.534);
        color: #eee2c088;
        font-size:xx-large;
        text-decoration:none ;
        text-transform:uppercase;
        background-color: #000;
        padding: 8px 0;
      }
      .titles{
        margin: 0px auto !important;
        padding-bottom: 30px !important;
      }
    </style>
    <div class="main titles">
        my tools
    </div>
    <div class="main">
    
      <div class="controls">
        <fieldset>
          <legend>tools</legend>
          <span>VIDEO</span>
          <a href="https://cloudconvert.com/" target="_blank">
            <button>Cloud Convert</button>
          </a>
        </fieldset>

        
      </div>
    </div>
  </body>
</html>
