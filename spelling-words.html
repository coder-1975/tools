        <style>
          * {
            box-sizing: border-box;
            border: none !important;
            padding: 0;
            margin: 0;
            font-family:

          }
          body {
            background: rgb(8, 8, 8);
            width: 100wv;
            height: 100hv;
            overflow: hidden;
          }
          #board {
            border: 10px double white !important;
            height: 100vh;
          }
          .diver {
            position: absolute;
            width: fit-content;
            height: fit-content;
            font-size: 3rem !important;
            text-align: center;
            vertical-align: middle;
            cursor: pointer;
            text-shadow: 1px 1px 1px rgb(178, 236, 60);
            text-shadow: 1px 2px 3px rgb(10, 10, 10);
            border-left: 1px solid rgb(135, 153, 135);
            border-top: 1px solid rgb(159, 184, 159);
            border-right: 1px solid rgb(10, 39, 10);
            border-bottom: 1px solid rgb(14, 44, 14);
            background: rgba(196, 196, 196, 0);
            color: rgb(159, 199, 50); /* black */
            color: rgba(6, 6, 43, 0.979);
            text-shadow: 1px 1px 1px rgb(236, 231, 231);
            z-index: 100;
          }

          #lettersboard {
            width: 31.1%;
            margin-bottom: 10px !important;
            height: 54vh !important;
            min-height: 54vh !important;
            max-height: 54vh !important;
            overflow: hidden;
            background-color: rgba(244, 242, 245, 0.418);
            /*background: linear-gradient(
              to bottom,
              rgb(102, 104, 102),
              rgba(32, 38, 46, 0.897),
              rgb(35, 44, 34)
            );*/
            top: 12px;
            left: 12px;
            position: absolute;
            z-index: 1;
            border: 2px solid rgb(5, 5, 5) !important;
          }
          #whiteboard {
            width: 419px !important;
            margin-bottom: 10px !important;
            height: 49vh !important;
            min-height: 49vh !important;
            max-height: 49vh !important;
            overflow: hidden;
            background-color: rgb(248, 250, 246);
            background-color: rgba(68, 97, 74, 0.822);
            bottom: 10px;
            position: absolute;
            margin-left: 5px;
            z-index: 0;
            border-top: 49px solid rgba(151, 180, 106, 0.897) !important;
          }

          #middlewhiteboard {
            font-size: 30px;
            text-shadow: 1px 2px 3px rgba(181, 201, 72, 0.753);
            width: 66.4% !important;
            text-indent: 15% !important;
            line-height: 190% !important;
            margin-bottom: 10px !important;
            height: 95vh !important;
            min-height: 95vh !important;
            max-height: 95vh !important;
            overflow: hidden;
            background-color: rgb(248, 250, 246);
            background-color: rgb(96, 114, 78);
            background: linear-gradient(
              to left,
              rgba(254, 255, 254, 0.63),
              rgba(219, 219, 219, 0.774),
              rgb(151, 150, 150)
            ) !important;
            bottom: 10px;
            position: fixed;
            right: 20px;
            z-index: 0;
            border-top: 48px solid rgba(162, 187, 125, 0.897) !important;
          }
          hr {
            border: 0.1px solid rgba(12, 12, 12, 0.144);
            border: 0.1px solid rgba(16, 129, 76, 0.336) !important;

            margin-left: 12px !important;
            margin-right: 12px !important;
          }

          /* سيتم تطبيق هذا التنسيق فقط على الشاشات التي يقل عرضها عن 600 بكسل */
          @media screen and (max-width: 800px) {
            body {
              background-color: lightblue;
            }
            #lettersboard {
              width: 100%;
              height: 50vh !important;
              min-height: 50vh !important;
              max-height: 50vh !important;
              background: none;
              background-color: rgb(243, 245, 247);
            }
            .diver {
              font-size: 2rem !important;
              color: rgb(14, 21, 59) !important;
              text-shadow: 1px 1px 1px rgb(140, 171, 207);
              border: 1px solid rgb(170, 175, 204) !important;
            }
            #middlewhiteboard {
              background-color: antiquewhite;
              line-height: 100% !important;
              z-index: 0;
              right: 0px;
              width: 100vw !important;
              border: 15px solid rgba(12, 12, 12, 0.932) !important;
            }
          }
          #creation {
            position: absolute;
            margin-top: 14px !important;
            padding-top: 2px !important;
            max-width: 40% !important;
            height: 1px !important;
            padding: 1px 2px !important;
            text-shadow: 1px 1px 1px rgb(178, 236, 60);
            color: black;
            /*transform: skewY(12deg);

            background-color: rgba(36, 56, 73, 0) !important;
            z-index: 1000;
          }

            text-align: center !important;
            height: 10px !important;
            padding: 2px 8px !important;
            background-color: rgba(240, 248, 255, 0.014) !important;

          #heading {

          @keyframes rotator {
            0% {
              background-color: rgba(240, 248, 255, 0.315);
              transform: rotate(-10deg);
              box-shadow: 1px 1px 1px 1px rgba(12, 12, 12, 0.637);
            }
            25% {
              background-color: rgba(240, 248, 255, 0.315);
              transform: rotate(-10deg);
              box-shadow: 1px 1px 1px 1px rgba(12, 12, 12, 0.425);
            }
            50% {
              transform: rotate(5deg);
              background-color: transparent;
              box-shadow: none !important;
            }
            100% {
              transform: rotate(5deg);
              background-color: transparent;
              box-shadow: none;
            }

            if (month < 10) {
              month = "0" + month;
            }
            let day = d.getDate();
            if (day < 10) {
              day = "0" + day;
            }

            let h = d.getHours();
            if (h > 12) {
              h = h - 12;
            }
            if (h < 10) {
              h = "0" + h;
            }
            let m = d.getMinutes();
            if (m < 10) {
              m = "0" + m;
            }
            let s = d.getSeconds();
            if (s < 10) {
              s = "0" + s;
            }

            clock.innerHTML = `<ul style="background-color:#000;list-style: none;text-align: center;color: white;font-size: 13px;display:flex;flex-direction:row;justify-content: space-around;">
